# ============================================================
# À inclure dans le VirtualHost HTTPS d'Apache pour
# aboaly.sipembanque.local (port 443)
#
# Dans httpd.conf ou httpd-vhosts.conf, ajouter AVANT la
# directive DocumentRoot (ou à la fin du bloc <VirtualHost>) :
#
#   Include "E:/Project 2026/Etat_journalier/apache_proxy.conf"
#
# Modules requis (décommenter dans httpd.conf si nécessaire) :
#   LoadModule proxy_module modules/mod_proxy.so
#   LoadModule proxy_http_module modules/mod_proxy_http.so
#   LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
#   LoadModule rewrite_module modules/mod_rewrite.so
# ============================================================

    # --- Proxy API → FastAPI (port 8000) ---
    ProxyRequests Off
    ProxyPreserveHost On

    # WebSocket Socket.IO  (doit être AVANT le ProxyPass /socket.io HTTP)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade  [NC]
    RewriteRule ^/socket\.io/(.*) ws://127.0.0.1:8000/socket.io/$1 [P,L]

    ProxyPass        /api        http://127.0.0.1:8000/api
    ProxyPassReverse /api        http://127.0.0.1:8000/api

    ProxyPass        /socket.io  http://127.0.0.1:8000/socket.io
    ProxyPassReverse /socket.io  http://127.0.0.1:8000/socket.io
